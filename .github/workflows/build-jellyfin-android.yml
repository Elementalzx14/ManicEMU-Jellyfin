name: Build Jellyfin Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Android emulator
        uses: actions/checkout@v4
        with:
          repository: Swordfish90/Lemuroid
          ref: 53752bf29bc3f95c50f6c38f70cd4a53450a7098
          path: android
          submodules: recursive
          persist-credentials: false
      - name: Apply Jellyfin Android integration
        working-directory: android
        run: git apply --check ../Jellyfin-Android.patch && git apply ../Jellyfin-Android.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test APK with bundled emulator cores
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:testFreeBundleDebugUnitTest :lemuroid-app:assembleFreeBundleDebug --stacktrace
      - name: Verify bundled cores and APK
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apk = glob.glob('android/lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk')
          assert len(apk) == 1, apk
          with zipfile.ZipFile(apk[0]) as z:
              for core in ['fceumm', 'snes9x', 'mgba', 'pcsx_rearmed', 'ppsspp']:
                  data = z.read('lib/arm64-v8a/lib' + core + '_libretro_android.so')
                  assert data[:4] == b'\x7fELF', core
              assert 'classes.dex' in z.namelist()
          PY
      - name: Allow the runner to use Android virtualization
        run: sudo setfacl -m u:"$USER":rw /dev/kvm
      - name: Launch APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          script: |
            adb install android/lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
            adb shell am start -W -n com.elementalzx14.jellyfingames.debug/com.swordfish.lemuroid.app.jellyfin.JellyfinActivity
            sleep 8
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml android-window.xml
            python3 -c 'import xml.etree.ElementTree as E; r=E.parse("android-window.xml"); assert any(n.get("text")=="Jellyfin Games" for n in r.iter("node")); assert any(n.get("text", "").casefold()=="sign in" for n in r.iter("node"))'
            adb shell screencap -p /sdcard/jellyfin.png
            adb pull /sdcard/jellyfin.png android-jellyfin.png
            python3 -c 'import xml.etree.ElementTree as E,re,subprocess; r=E.parse("android-window.xml"); n=next(n for n in r.iter("node") if n.get("text", "").casefold()=="sign in"); b=list(map(int,re.findall(r"\d+",n.get("bounds")))); subprocess.run(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)],check=True)'
            sleep 2
            adb shell uiautomator dump /sdcard/login.xml
            adb pull /sdcard/login.xml android-login.xml
            python3 -c 'import xml.etree.ElementTree as E; r=E.parse("android-login.xml"); assert any(n.get("text")=="Sign in to Jellyfin" for n in r.iter("node"))'
            adb shell input keyevent 4
            python3 -c 'import xml.etree.ElementTree as E,re,subprocess; r=E.parse("android-window.xml"); n=next(n for n in r.iter("node") if n.get("text", "").casefold().startswith("downloaded games")); b=list(map(int,re.findall(r"\d+",n.get("bounds")))); subprocess.run(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)],check=True)'
            sleep 8
            adb shell uiautomator dump /sdcard/local.xml
            adb pull /sdcard/local.xml android-local.xml
            adb shell screencap -p /sdcard/local.png
            adb pull /sdcard/local.png android-local.png
            adb logcat -d -s AndroidRuntime:E > android-runtime.log
            if grep -q "FATAL EXCEPTION" android-runtime.log; then cat android-runtime.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-launch-check
          path: |
            android-window.xml
            android-login.xml
            android-local.xml
            android-local.png
            android-jellyfin.png
            android-runtime.log
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin-Games-Android
          path: android/lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: android/lemuroid-app/build/reports/tests/
          if-no-files-found: ignore
